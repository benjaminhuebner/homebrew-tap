name: Bump

# Started by the release workflow of each app, and by hand for a retry. It has no schedule on
# purpose: GitHub disables scheduled workflows in a quiet repository, and a disabled workflow
# cannot be started from outside either.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  bump:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAP: benjaminhuebner/tap
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ github.token }}

      - name: Update the casks
        id: update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .github/scripts/update-casks.sh "$TAP"
          echo "commits=$(git rev-list --count "$GITHUB_SHA..HEAD")" >>"$GITHUB_OUTPUT"

      # A push from this workflow starts no other workflow, so the tests run here, before it.
      - name: Test the casks
        if: steps.update.outputs.commits != '0'
        run: .github/scripts/test-casks.sh "$TAP"

      - name: Publish the update
        if: steps.update.outputs.commits != '0'
        run: git push origin HEAD:main
